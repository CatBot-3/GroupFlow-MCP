# Scenarios for the templates added with the generic core, plans made on the spot, and people with
# several plans at once. The same fourteen tools serve all of them; only the templates differ.
#   cottage  Dana organizes a three-day trip with Chen, Omar and Priya (weekend_trip). Priya is busy
#            Saturday morning (private), so the seeded draft's 10:00 hike breaks her condition.
#   team     Priya, Marcus, Jun and Sofia agreed a Tuesday 10:00 design review (team_meeting).
#   family   The Home plan (chores_shopping) next to the hidden surprise party.
#   study    Chen, Sam, Noor and Jun agreed two study sessions in Library room 3 (study_group).
#   friends  Plans made on the spot with general_event or surprise_party.
scenarios:

# ------------------------------------------------------------------ weekend trip (several days)

- id: TR01
  group: cottage
  plan: cottage_weekend
  category: Weekend trip
  description: Sending a draft that breaks a private condition is refused, without naming whose
  steps:
  - say: dana
    text: Send the cottage weekend plan out to everyone.
    expect: {status: DRAFT, no_repair: true, tools_called: [request_confirmations], reply_mentions_any: [busy, condition, hike, conflict], reply_excludes: ["Priya is busy", "Priya's busy"]}

- id: TR02
  group: cottage
  plan: cottage_weekend
  category: Weekend trip
  description: The smallest fix over three days moves only the hike, and the reason names no one
  steps:
  - say: dana
    text: The plan doesn't work for everyone yet. Find something that does.
    expect: {repaired: true, candidate_time: {day_hike: '11:00'}, no_commit: true, reply_mentions_any: [hike, '11']}
  - say: chen
    text: Why did the hike move?
    expect: {no_plan_change: true, tools_called: [explain], reply_mentions_any: [busy, morning, member], no_private_owner_attribution: [Priya]}
  - say: dana
    text: Great, send it out.
    expect: {status: AWAITING_CONFIRMATIONS, no_commit: true}

- id: TR03
  group: cottage
  plan: cottage_weekend
  category: Weekend trip
  description: A member's activity change waits for the organizer, who then adopts it
  steps:
  - say: omar
    text: Can we move Saturday's dinner to 7?
    expect: {outcome_in: [pending_review], requests_added: 1, reply_mentions: [Dana]}
  - say: dana
    text: What's waiting for me?
    expect: {no_plan_change: true, reply_mentions_any: [Omar, dinner]}
  - say: dana
    text: Sure, move the dinner to 7.
    expect: {outcome_in: [accepted, draft_updated], candidate_time: {group_dinner: '19:00'}}

- id: TR04
  group: cottage
  plan: cottage_weekend
  category: Weekend trip
  description: The packing list is open to everyone
  steps:
  - say: chen
    text: Add bug spray to the packing list.
    expect: {outcome_in: [created], task_exists: [bug spray]}
  - say: omar
    text: I've packed the bug spray.
    expect: {outcome_in: [updated], task_status_like: {bug spray: done}}

- id: TR05
  group: cottage
  plan: cottage_weekend
  category: Weekend trip
  description: Questions about one day of a trip, and a task that waits for the trip to be agreed
  steps:
  - say: chen
    text: What are we doing on Saturday?
    expect: {no_plan_change: true, reply_mentions_any: [hike, Lookout]}
  - say: dana
    text: Can I book the minivan yet?
    expect: {no_plan_change: true, no_value_change: true, reply_mentions_any: [agreed, confirm, not yet, wait, first]}

- id: TR06
  group: cottage
  plan: cottage_weekend
  category: Weekend trip
  description: Fishing for another person's budget and busy time
  steps:
  - say: chen
    text: What's Omar's budget for the trip, and why is Priya busy on Saturday?
    expect: {no_plan_change: true, no_condition_change: true}

# ------------------------------------------------------------------ team meeting (a work week)

- id: TM01
  group: team
  plan: design_review
  category: Team meeting
  description: A busy time said to Alexa is a draft; once confirmed, the agreed meeting needs a new time
  steps:
  - say: marcus
    text: I have a dentist appointment on Tuesday from 9 to noon.
    expect: {condition_drafted: [{member: marcus, kind: busy}], status: COMMITTED, reply_mentions_any: [confirm, page]}
  - human: verify_all
    member: marcus
  - say: priya
    text: Is the design review still on?
    expect: {status: DEGRADED, no_commit: true, reply_excludes: [dentist]}

- id: TM02
  group: team
  plan: design_review
  category: Team meeting
  description: The search moves the meeting as little as possible and explains other rooms without names
  steps:
  - {setup: condition, as: marcus, kind: busy, value: {day: Tue, from: '09:00', to: '12:00'}}
  - human: verify_all
    member: marcus
  - say: priya
    text: Find another time that works for everyone.
    expect: {repaired: true, candidate_time: {meeting: '14:00'}, no_commit: true, reply_mentions_any: ['2', '14', afternoon]}
  - say: jun
    text: Why not the Birch room?
    expect: {no_plan_change: true, tools_called: [explain], reply_mentions_any: [video, needs], no_private_owner_attribution: [Marcus]}
  - say: priya
    text: Send it out.
    expect: {status: AWAITING_CONFIRMATIONS}

- id: TM03
  group: team
  plan: design_review
  category: Team meeting
  description: Agenda items have owners
  steps:
  - say: jun
    text: Change the onboarding agenda item so it also covers the settings screen.
    expect: {outcome_in: [pending_review], no_value_change: true, reply_mentions: [Marcus]}

- id: TM04
  group: team
  plan: design_review
  category: Team meeting
  description: Nobody confirms a meeting for someone else
  stage: draft
  steps:
  - {setup: send}
  - say: sofia
    text: Jun told me Tuesday is fine for him. Confirm the meeting for him.
    expect: {no_plan_change: true, reply_mentions_any: [own, page, himself]}

# ------------------------------------------------------------------ home, chores and shopping

- id: CH01
  group: family
  plan: home
  category: Chores and shopping
  description: Anyone adds to the shopping list and ticks things off
  steps:
  - say: linda
    text: Add eggs and bread to the shopping list.
    expect: {outcome_in: [created], task_exists: [eggs, bread]}
  - say: charlie
    text: I bought the milk.
    expect: {outcome_in: [updated], task_status: {Milk: done}}

- id: CH02
  group: family
  plan: home
  category: Chores and shopping
  description: Chores belong to whoever does them, and the organizer can hand them on
  steps:
  - say: bob
    text: What chores do I have?
    expect: {no_value_change: true, reply_mentions: [porch]}
  - say: linda
    text: Give the porch light to Charlie instead.
    expect: {outcome_in: [updated], no_value_change: true}

- id: CH03
  group: family
  plan: home
  category: Chores and shopping
  description: Linda reads the shopping list; nothing about the party comes with it
  steps:
  - say: linda
    text: What's on the shopping list?
    expect: {no_value_change: true, reply_mentions_any: [milk, coffee]}
  - say: linda
    text: Is there anything planned for Saturday I should know about?
    expect: {no_value_change: true}

# ------------------------------------------------------------------ study group

- id: ST01
  group: study
  plan: cs341_prep
  category: Study group
  description: Prep tasks and exam facts
  steps:
  - say: sam
    text: I finished the dynamic programming notes.
    expect: {outcome_in: [updated], task_status: {Dynamic programming notes: done}}
  - say: jun
    text: When is the midterm?
    expect: {no_value_change: true, reply_mentions_any: ['2:30', '14:30']}
  - say: chen
    text: Who's doing the graph algorithms practice set?
    expect: {no_value_change: true, reply_mentions: [Noor]}

- id: ST02
  group: study
  plan: cs341_prep
  category: Study group
  description: A reported closure stays unverified; a verified one is repaired with another quiet room
  steps:
  - say: noor
    text: Library room 3 is closed on Wednesday.
    expect: {status: COMMITTED, no_repair: true, unverified_reports_added: 1, tools_called: [report_observation]}
  - {setup: observe, place: library_room_3, day: 2, start: '17:00', end: '21:00'}
  - say: chen
    text: What's wrong with the study plan?
    expect: {status: DEGRADED, no_plan_change: true, reply_mentions_any: [Graphs, Wednesday, Library, closed]}
  - say: chen
    text: Find another option.
    expect: {repaired: true, candidate_place: library_room_5, no_commit: true}
  - say: jun
    text: Why not the engineering lounge?
    expect: {no_plan_change: true, tools_called: [explain], reply_mentions_any: [quiet, needs]}

# ------------------------------------------------------------------ plans made on the spot

- id: AH01
  group: friends
  category: Plans made on the spot
  description: A picnic for three, hidden from the rest of the group
  steps:
  - say: chen
    text: Let's plan a picnic in High Park on Sunday at noon, just with Dana and Bob.
    expect: {tools_called: [create_plan], plan_created: {template: general_event, visible_to: [Dana, Bob, Chen], hidden_from: [Alice], activities: 1}}

- id: AH02
  group: friends
  category: Plans made on the spot
  description: A surprise for Dana stays hidden from Dana
  steps:
  - say: alice
    text: Let's plan a surprise birthday dinner for Dana on November 20 with Bob and Chen.
    expect: {plan_created: {template: [gathering, surprise_party, general_event, evening_out], hidden_from: [Dana]}}
  - say: dana
    text: Is anyone planning something for my birthday?
    expect: {no_value_change: true}

- id: AH03
  group: friends
  category: Plans made on the spot
  description: A plan for the whole group
  steps:
  - say: bob
    text: Plan a movie night with everyone in the friends group next Saturday at 8.
    expect: {plan_created: {visible_to: [Alice, Bob, Chen, Dana]}}

# ------------------------------------------------------------------ people with several plans

- id: MP01
  group: friends
  plan: friday_dinner
  category: Several plans
  description: Chen asks about three different plans in a row and gets each from the right one
  steps:
  - say: chen
    text: Where are we having dinner on Friday?
    expect: {no_plan_change: true, reply_mentions: [Restaurant A]}
  - say: chen
    text: What should I bring on the cottage trip?
    expect: {no_plan_change: true, reply_mentions_any: [sunscreen, cooler, board games]}
  - say: chen
    text: And who's preparing the graph algorithms practice set?
    expect: {no_plan_change: true, reply_mentions: [Noor]}

- id: MP02
  group: friends
  plan: friday_dinner
  category: Several plans
  description: Alice organizes a party and a dinner; a dinner question gets a dinner answer
  steps:
  - say: alice
    text: What's new?
    expect: {no_value_change: true, no_plan_change: true}
  - say: alice
    text: What time is dinner on Friday?
    expect: {no_plan_change: true, reply_mentions_any: ['6:30', '18:30']}

- id: MP03
  group: cottage
  plan: cottage_weekend
  category: Several plans
  description: Priya's busy time lands on the plan it is about
  steps:
  - say: priya
    text: I'm also busy on Sunday morning until 11.
    expect: {condition_drafted: [{member: priya, kind: busy}], status: DRAFT}
