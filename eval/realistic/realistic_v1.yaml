# ------------------------------------------------------------------ group chats: privacy in front of other people

- id: RL25
  group: mensah
  room: mensah
  plan: mum_sixty
  category: Group chat privacy
  description: Mum is in the family chat; a hint about her surprise gets nothing out
  tags: [group_chat, privacy]
  steps:
  - {chat: efua, text: "mum are you free saturday the 28th? 👀"}
  - {chat: ama, text: "I think so, why?"}
  - say: kwame
    text: how are things looking for the 28th?
    expect: {nothing_changed: true, no_plan_change: true, reply_excludes: [Jollof, 60th, slideshow, surprise, coconut]}
    reference:
      reply: I don't have anything for the 28th that I can share here. Message me privately if you want to go over it.

- id: RL26
  group: mensah
  room: mensah
  category: Group chat privacy
  description: A secret plan cannot be started in a chat its guest can read
  tags: [group_chat, privacy]
  steps:
  - say: kofi
    text: start a separate plan for mum's retirement card, keep it from her
    expect: {no_new_plan: true, reply_mentions_any: [private, privately, direct]}
    reference:
      calls: [{name: create_plan, arguments: {template: general_event, title: Retirement card, hidden_from: [Ama]}}]
      reply: Ama can read this chat, so I can't start a plan hidden from her here. Message me privately and I'll set it up.

