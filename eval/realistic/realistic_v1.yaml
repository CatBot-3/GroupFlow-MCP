# Realistic held-out suite, version 1.
#
# How people actually talk to an assistant about plans: colloquial, with typos and slang, wrapped in
# unrelated news, two plans in one breath, self-corrections, jokes, and group chats where several
# people talk and only one message is addressed to Alexa. It runs in its own world
# (eval/worlds/realistic.yaml): none of these people, places or sentences appear in the prompt, the
# server instructions, the tool descriptions or the templates (tests/evals/test_realistic.py checks
# every sentence for a shared 5-word sequence and every name).
#
# Rules for keeping it held out:
#   * Do not tune the prompt or tool descriptions on these sentences. If you inspect failures and change
#     the prompt, the suite becomes a regression set: freeze a new version (realistic_v2) with new sentences.
#   * frozen_prompt_sha256 records the prompt corpus this version was written against; every report says
#     whether the current prompt still matches it.
#   * Each turn carries a reference trajectory (the tool calls and reply of a correct assistant). The
#     reference is never shown to the model: tests replay it against the real server to prove each
#     expectation is satisfiable, and replay trivial policies (say nothing, record everything) to prove
#     each scenario can fail.
#
# Freeze history: first frozen against prompt corpus sha256:9eb136aa...; re-frozen the same day after the casual-speech
# rewrite of the prompt, tool descriptions and server instructions. The suite had never been run against a model, so no
# prompt change was tuned on its results, and the rewrite's examples share no 4-word sequence with these sentences.
# The same change widened four server guards to casual phrasings ("not doing X", "isn't coming", "keep this to myself",
# "im"); RL11 uses one of them ("def not doing"), so that scenario is not fully independent of the change.
# Re-frozen a second time (v0.7, sha256:3fbb43e6... before) after three tools were added for telling people and asking first
# (notify_people, ask_followup, answer_followup), with a paragraph in the host prompt and one sentence in the server instructions.
# Still never run against a model, so nothing was tuned on these results; the new text shares no 5-word sequence with this file.
#
# room: <group> means the turn comes from that group's chat: chat steps are messages people wrote to
# each other (no model call), and everyone in the room reads Alexa's reply. Without room the person
# talks to Alexa alone (their Echo or private thread).
world: eval/worlds/realistic.yaml
frozen_prompt_sha256: "sha256:2fdf77bc0e9b25a1aa7d9d92a590f69f25f92528f867702382624163da03b91b"
scenarios:

# ------------------------------------------------------------------ requests buried in noise

- id: RL01
  group: flat
  category: Noise around a request
  description: Venting about work, then one shopping item for the flat
  tags: [noise, colloquial]
  steps:
  - say: maya
    text: ugh my manager booked ANOTHER 7am standup, brutal week. anyway we're totally out of dish soap, can you stick it on the flat list
    expect: {item_added_in: {flat_jobs: [dish soap]}, no_item_like: [standup, manager], plans_untouched: [housewarming, book_night]}
    reference:
      calls: [{name: propose_change, arguments: {plan: flat_jobs, new_type: list_item, title: Dish soap}}]
      reply: Added dish soap to the flat list.

- id: RL02
  group: flat
  category: Chatter, not a request
  description: A funny story about the landlord's dog changes nothing
  tags: [noise, abstain]
  steps:
  - say: kofi
    text: honestly the landlord's dog starts barking every single time I open the fridge, it's like he knows
    expect: {nothing_changed: true}
    reference:
      reply: Ha, that sounds like one very attentive dog.

- id: RL03
  group: flat
  category: Chatter, not a request
  description: Laughing emoji and an ok change nothing
  tags: [noise, abstain]
  steps:
  - say: ines
    text: lol 😂😂 ok fair
    expect: {nothing_changed: true}
    reference:
      reply: Glad that made you laugh.

- id: RL04
  group: flat
  category: Noise around a request
  description: A long ramble about a cousin's wedding hides an offer to take over the drinks run
  tags: [noise, ownership]
  steps:
  - say: theo
    text: so my cousin's wedding is in march which is already total chaos with the seating stuff, but anyway yes I'll grab the drinks for the housewarming, doing a costco run friday
    expect: {outcome_in: [pending_review, updated], no_item_like: [wedding, cousin, seating]}
    reference:
      calls: [{name: propose_change, arguments: {plan: housewarming, item: Buy drinks, owner: Theo, due: Friday}}]
      reply: Maya has the drinks run, so I asked her to hand it to you for Friday.

# ------------------------------------------------------------------ several plans in one breath

- id: RL05
  group: flat
  category: Several plans at once
  description: One message touches the flat list and a book club task
  tags: [multi_plan, colloquial]
  steps:
  - say: maya
    text: ok two things. add oat milk to our flat list, and for book club I've picked next month's book, it's Night Ferry
    expect: {item_added_in: {flat_jobs: [oat milk]}, task_status_like: {Pick next month: done}, plans_untouched: [housewarming]}
    reference:
      calls:
      - {name: propose_change, arguments: {plan: flat_jobs, new_type: list_item, title: Oat milk}}
      - {name: propose_change, arguments: {plan: book_night, item: "Pick next month's book", status: done}}
      reply: Oat milk is on the flat list, and next month's book is picked.

- id: RL06
  group: climbing
  category: Several plans at once
  description: Gear for one group's plan and a question about another group's plan
  tags: [multi_plan, colloquial]
  steps:
  - say: lena
    text: for tuesday can you add finger tape to the climbing gear list, and also is hana still hosting book club or did that change
    expect: {item_added_in: {climb_night: [finger tape]}, plans_untouched: [book_night], reply_mentions_any: [Hana]}
    reference:
      calls: [{name: propose_change, arguments: {plan: climb_night, new_type: list_item, title: Finger tape}}]
      reply: Finger tape is on the climbing list, and book club is still at Hana's place.

- id: RL07
  group: mensah
  category: Several plans at once
  description: '"The lunch" picks the right plan among four'
  tags: [multi_plan, abstain]
  steps:
  - say: kofi
    text: wait what time is the lunch again
    expect: {nothing_changed: true, reply_mentions_any: ["1:00", "1 pm", "1pm", "one"]}
    reference:
      reply: Sunday lunch is at Mum's at 1:00 pm.

- id: RL08
  group: flat
  category: Several plans at once
  description: '"What do I need to do" gathers tasks from every plan, after a sigh'
  tags: [multi_plan, noise, abstain]
  steps:
  - say: maya
    text: omg what a day. ok what do I actually need to do this week
    expect: {nothing_changed: true, reply_mentions_any: [drinks, book]}
    reference:
