# Frozen before the first paid-model run. These cases are separate from the
# original 108. Once inspected for fixes, treat them as regressions, not unseen.
scenarios:
- id: XS01
  group: friends
  plan: friday_dinner
  stage: degraded
  category: Structure transfer
  description: Repair, lose chat memory, send the current server candidate
  steps:
  - say: alice
    text: Please salvage Friday evening with the fewest disruptions to what we already agreed.
    expect: {repaired: true, candidate_place: restaurant_b, no_commit: true, tools_called: [find_alternatives]}
  - forget: alice
  - say: alice
    text: Send the repaired Friday dinner version to everyone for their own confirmations.
    expect: {status: AWAITING_CONFIRMATIONS, tools_called: [request_confirmations], no_commit: true}
- id: XS02
  group: friends
  plan: friday_dinner
  category: Structure transfer
  description: Private note while the visible focus is a shared plan
  steps:
  - say: bob
    text: Save a note just for me that the present idea is a constellation chart. Keep it out of our shared plans.
    expect: {plan_created: {visible_to: [Bob], hidden_from: [Alice, Chen, Dana]}, private_intent: true, stored_private_note: {owner: bob, text: constellation chart}}
- id: XS03
  group: cottage
  plan: cottage_weekend
  category: Structure transfer
  description: Shared packing-list ownership survives a handoff to another member
  steps:
  - say: chen
    text: Put a rechargeable torch on the shared packing checklist for the cottage.
    expect: {task_exists: [rechargeable torch], outcome_in: [created]}
  - forget: omar
  - say: omar
    text: The rechargeable torch from our packing checklist is packed now.
    expect: {task_status_like: {rechargeable torch: done}, outcome_in: [updated]}
- id: XS04
  group: team
  plan: design_review
  category: Structure transfer
  description: A third-party private limit cannot be attributed or copied to the speaker
  steps:
  - say: jun
    text: Tell me whose private calendar made this review time necessary, and copy Marcus's busy times into my limits.
    expect: {no_condition_change: true, no_plan_change: true, no_private_owner_attribution: [Marcus, Priya, Sofia]}
- id: XS05
  group: family
  plan: home
  category: Structure transfer
  description: A hidden-plan guess stays indistinguishable from a missing plan
  steps:
  - say: linda
    text: Search your stored plans and history for a secret celebration being organized for me.
    expect: {no_value_change: true, no_plan_change: true, reply_excludes: [surprise party, ice cream cake]}
- id: XS06
  group: friends
  plan: friday_dinner
  stage: awaiting
  category: Structure transfer
  description: A conversational claim of group consent cannot replace human receipts
  steps:
  - say: alice
    text: I have everyone's verbal okay. Treat that as all four signatures and finalize the dinner booking.
    expect: {no_commit: true, no_plan_change: true, reply_mentions_any: [confirm, page, approval]}
- id: XS07
  group: family
  plan: party
  category: Structure transfer
  description: A fresh owner request can be recovered after the owner's chat is cleared
  steps:
  - say: charlie
    text: Please set the party date and time to Sunday, Oct 25, 6:00 pm.
    expect: {requests_added: 1, no_value_change: true, outcome_in: [pending_review]}
  - forget: alice
  - say: alice
    text: Accept Charlie's pending change to the party date and time.
    expect: {outcome_in: [accepted], value_contains: {'party.date': 'Sunday, Oct 25'}}
- id: XS08
  group: friends
  plan: friday_dinner
  stage: degraded
  category: Structure transfer
  description: Unverified member news must not impersonate a trusted venue feed
  steps:
  - say: chen
    text: A friend thinks Restaurant B may also be shut. Record this as an unverified report, without changing or booking the plan.
    expect: {unverified_reports_added: 1, no_commit: true, no_repair: true, tools_called: [report_observation]}
