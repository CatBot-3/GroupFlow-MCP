# The demo world. All people and data are fictional. Each simulated Echo connects to the MCP
# server with its person's bearer token, so identity comes from the connection, never from what
# the model says. The passcode is a separate credential for the person's own confirmation page,
# which the agent never holds. A real Alexa+ deployment would use account linking (OAuth) for the
# token and a proper login for the page.
#
# People can be in several groups (Alice and Bob are in the family and in the friends group;
# Chen is in the friends, the cottage trip and the study group; Jun and Priya each have two).
# Plans are made from templates (groupflow/templates) and seeded by replaying what people said
# through the engine itself, so every value has real provenance.

people:
  - {id: alice, name: Alice, token: gf_demo_alice_7f3k, passcode: alice-demo, color: "#C98A00"}
  - {id: bob, name: Bob, token: gf_demo_bob_2m9q, passcode: bob-demo, color: "#2F6FB0"}
  - {id: charlie, name: Charlie, token: gf_demo_charlie_8d1x, passcode: charlie-demo, color: "#2F8A57"}
  - {id: linda, name: Linda, token: gf_demo_linda_5p0w, passcode: linda-demo, color: "#C0437A"}
  - {id: chen, name: Chen, token: gf_demo_chen_k3v6, passcode: chen-demo, color: "#2F855A"}
  - {id: dana, name: Dana, token: gf_demo_dana_m9x1, passcode: dana-demo, color: "#B83280"}
  - {id: omar, name: Omar, token: gf_demo_omar_r5t2, passcode: omar-demo, color: "#8A5A2B"}
  - {id: priya, name: Priya, token: gf_demo_priya_h8c4, passcode: priya-demo, color: "#6B46C1"}
  - {id: marcus, name: Marcus, token: gf_demo_marcus_w2p7, passcode: marcus-demo, color: "#2C7A7B"}
  - {id: jun, name: Jun, token: gf_demo_jun_b6n3, passcode: jun-demo, color: "#C05621"}
  - {id: sofia, name: Sofia, token: gf_demo_sofia_e4k9, passcode: sofia-demo, color: "#2B6CB0"}
